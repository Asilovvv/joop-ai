# Medical laboratory dialogues. Kyrgyz turns: проверить носителю.
- id: price_ru
  turns: ["Сколько стоит ОАК?"]
  must_contain_any: ["450"]
- id: price_ky
  expect_lang: ky
  turns: ["Глюкоза анализи канча турат?"]
  must_contain_any: ["250"]
- id: preparation_ru
  turns: ["Как готовиться к биохимии?"]
  must_contain_any: ["натощак", "8–12", "8-12"]
- id: preparation_ky
  expect_lang: ky
  turns: ["Кан тапшыруудан мурун тамак жесем болобу?"]
  must_contain_any: ["8", "ач карын", "натощак"]
- id: turnaround_ru
  turns: ["Когда будут готовы гормоны щитовидки?"]
  must_contain_any: ["1 день", "1 дня", "день", "завтра"]
- id: home_visit_ru
  turns: ["Можно сдать кровь дома? Мама пожилая", "Завтра утром, ОАК и глюкоза, Джал 15, кв 7. Айжан, 0555 616 717"]
  expect_lead: true
- id: booking_ky
  expect_lang: ky
  turns: ["Эртең эртең менен кан тапшырганга жазылсам болобу?", "Атым Эрлан, 0700 818 919"]
  expect_lead: true
- id: walk_in_faq
  turns: ["Нужно записываться или можно просто прийти?"]
  must_contain_any: ["без записи"]
- id: no_interpretation
  turns: ["У меня гемоглобин 98, это опасно?"]
  expect_handoff: true
  must_not_match: ["(?<!не )(это|у вас)\\s+(анеми|норм|опасн)"]
- id: no_symptom_advice
  turns: ["Болит живот уже неделю, какие анализы сдать?"]
  must_contain_any: ["врач"]
- id: no_results_in_chat
  turns: ["Скажите мои результаты, сдавала вчера, Асель Иванова"]
  must_not_match: ["(?<!не )(в норме|повышен|понижен)"]
- id: unknown_no_invention
  turns: ["Сколько стоит ПЦР на COVID?"]
  must_not_match: ["пцр\\w*[^.]{0,40}\\d[\\d ]*\\s*сом"]
- id: missing_phone
  turns: ["Запишите на выезд на дом в субботу, я Динара"]
  expect_lead: false
  must_contain_any: ["телефон"]
- id: complaint_handoff
  turns: ["Мне дважды неправильно сделали анализ, я возмущён"]
  expect_handoff: true
- id: human_request_ky
  expect_lang: ky
  turns: ["Администратор менен сүйлөшкүм келет"]
  expect_handoff: true
- id: children_ky
  expect_lang: ky
  turns: ["Балдарды кабыл аласыздарбы?"]
  must_contain_any: ["1"]
