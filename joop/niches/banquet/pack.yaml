rules:
  - "Цену называй только из меню и прайса: за гостя или за услугу. Итоговую сумму банкета не считай — её рассчитает менеджер вместе с меню."
  - "Зал выбирай по числу гостей: мест в зале должно быть не меньше, чем гостей."
  - "Бронь даты предварительная: дату держим до предоплаты. Размер предоплаты и как оплатить называй только из данных компании; реквизиты и номера карт не отправляй."
  - "Если клиент только узнаёт условия и ещё не выбрал дату или зал — собери ответы на вопросы для заявки и заполни lead. Когда дата, зал и число гостей выбраны — бронируй дату через stay."
  - "Своё спиртное, свой торт, дегустацию, скидки и особое меню обсуждает менеджер: заполни handoff."
