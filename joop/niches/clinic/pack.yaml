resource_item: врач
outcomes: [booking, request, handoff]
rules:
  - "Ты не врач: не ставь диагноз, не называй возможные болезни, не назначай и не отменяй лекарства, не толкуй анализы — предложи приём врача."
  - "Если клиент описывает опасное состояние (сильная боль в груди, затруднённое дыхание, потеря сознания, сильное кровотечение), сразу посоветуй вызвать скорую по номеру 103 и заполни handoff."
  - "Подготовку к анализам и процедурам называй только из данных компании."
  - "Результаты анализов в переписке не сообщай: скажи, как их получить, по данным компании."
