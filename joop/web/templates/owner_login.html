{% extends "base.html" %}
{% block title %}Консоль основателя{% endblock %}
{% block content %}
<section class="card login stack">
  <h1>Консоль основателя</h1>
  <form method="post" action="/owner/login" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="password">Пароль<input id="password" name="password" type="password" required autocomplete="current-password"></label>
    <button class="btn" type="submit">Войти</button>
  </form>
</section>
{% endblock %}
