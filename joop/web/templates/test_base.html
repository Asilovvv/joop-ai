<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{ t.title }} — {{ b.name }}</title>
<link rel="stylesheet" href="/static/fonts/fonts.css">
<style>
:root { --bg: #f6f4ef; --paper: #fff; --ink: #1d1f1c; --muted: #5f645c; --line: #e2ded4; --accent: #0d7a68; --accent-ink: #fff; --bad: #b3261e; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #121512; --paper: #1b201c; --ink: #ecefe9; --muted: #a1a99f; --line: #2c332d; --accent: #3dbea3; --accent-ink: #121512; --bad: #f2b8b5; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
.wrap { max-width: 640px; margin: 0 auto; padding: 28px 16px 48px; }
h1 { font-size: clamp(24px, 5vw, 32px); line-height: 1.15; margin: 0 0 8px; text-wrap: balance; }
.muted { color: var(--muted); } .small { font-size: 14px; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-top: 18px; }
label { display: block; margin-bottom: 12px; }
input[type=text], input[type=tel] { display: block; width: 100%; margin-top: 4px; padding: 12px; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
.check { display: flex; gap: 10px; align-items: flex-start; }
.check input { margin-top: 5px; }
.btn { display: inline-block; border: 0; background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 600; padding: 13px 22px; border-radius: 12px; cursor: pointer; text-decoration: none; }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
.opt { display: flex; gap: 10px; align-items: center; padding: 12px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; cursor: pointer; }
.opt:has(input:checked) { border-color: var(--accent); }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 14px; }
.flash { padding: 10px 14px; border-radius: 10px; margin-top: 12px; border: 1px solid var(--line); }
.flash.error { color: var(--bad); }
.big { font-size: 44px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.hp { position: absolute; left: -9999px; }
[hidden] { display: none !important; }
.js .q { display: none; } .js .q.on { display: block; }
.timer { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main class="wrap">
  <p class="muted small">{{ b.name }}</p>
  {% for kind, text in flashes %}<p class="flash {{ kind }}">{{ text }}</p>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
