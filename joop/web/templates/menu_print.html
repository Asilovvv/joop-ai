<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR-коды — {{ b.name }}</title>
<style>
@page { size: A4; margin: 10mm; }
body { margin: 0; background: #fff; color: #111; font: 14px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
.tools { padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.tools button { font: inherit; padding: 8px 16px; border-radius: 8px; border: 1px solid #111; background: #111; color: #fff; cursor: pointer; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(62mm, 1fr)); gap: 0; padding: 0 16px 16px; }
.card { border: 1px dashed #bbb; padding: 6mm 4mm; text-align: center; break-inside: avoid; }
.card svg { width: 42mm; height: 42mm; display: block; margin: 0 auto 3mm; }
.name { font-weight: 700; font-size: 16px; }
.hint { color: #444; margin-top: 1mm; }
.num { margin-top: 2mm; font-size: 18px; font-weight: 700; }
@media print { .tools { display: none; } .grid { padding: 0; } }
</style>
</head>
<body>
<div class="tools"><button type="button" onclick="window.print()">Печать</button><span>Разрежьте по пунктиру. Код ведёт на страницу «{{ title }}» — {{ b.name }}.</span></div>
<div class="grid">
  {% for n, svg in cards %}
  <div class="card">
    {{ svg }}
    <div class="name">{{ b.name }}</div>
    <div class="hint">{{ title }} и заказ — наведите камеру</div>
    {% if n %}<div class="num">Стол {{ n }}</div>{% endif %}
  </div>
  {% endfor %}
</div>
</body>
</html>
