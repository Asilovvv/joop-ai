<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Joop AI{% endblock %}{% if business %} · {{ business.name }}{% endif %}</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
{% if business %}
<header class="top">
  <div class="top-in">
    <a class="brand" href="/panel">Joop AI</a>
    <span class="biz">{{ business.name }}</span>
    <form method="post" action="/logout" class="inline">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button class="link" type="submit">Выйти</button>
    </form>
  </div>
  <nav class="nav" aria-label="Разделы">
    {% for href, key, label in nav %}<a href="{{ href }}" class="{{ 'on' if active == key else '' }}">{{ label }}</a>{% endfor %}
  </nav>
</header>
{% endif %}
<main class="wrap">
  {% for kind, text in flashes %}<div class="flash {{ kind }}" role="status">{{ text }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
