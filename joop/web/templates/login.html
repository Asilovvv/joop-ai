{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<a class="bare-brand" href="/"><span class="mark" aria-hidden="true">J</span>Joop AI</a>
<section class="card login stack">
  <div>
    <h1>Joop AI</h1>
    <p class="muted">Панель управления ИИ-администратором</p>
  </div>
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="slug">Логин компании или её телефон
      <input id="slug" name="slug" autocomplete="username" required placeholder="ak-tish-dent или 0555 123 456">
    </label>
    <label for="user">Ваш логин сотрудника — если вход не владельца
      <input id="user" name="user" autocomplete="off" placeholder="необязательно">
    </label>
    <label for="password">Пароль
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </label>
    <button class="btn" type="submit">Войти</button>
  </form>
</section>
{% endblock %}
