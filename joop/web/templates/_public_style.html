{# Shared look of the public pages /m/<slug> and /m/<slug>/book: light and dark, phone first. #}
<style>
:root { --bg: #f6f4ef; --paper: #fff; --ink: #1d1f1c; --muted: #5f645c; --line: #e2ded4; --accent: #0d7a68; --accent-ink: #fff; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #121512; --paper: #1b201c; --ink: #ecefe9; --muted: #a1a99f; --line: #2c332d; --accent: #3dbea3; --accent-ink: #121512; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.45 "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
.wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 96px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.lang a { color: var(--muted); text-decoration: none; font-size: 14px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px; }
.lang a.on { color: var(--ink); border-color: var(--ink); }
h1 { font-size: clamp(26px, 6vw, 34px); line-height: 1.1; margin: 18px 0 4px; text-wrap: balance; }
.muted { color: var(--muted); } .small { font-size: 14px; }
.table { display: inline-block; margin-top: 8px; padding: 4px 10px; border-radius: 8px; background: var(--paper); border: 1px solid var(--line); font-weight: 600; }
nav.cats { display: flex; gap: 8px; overflow-x: auto; padding: 14px 0 4px; position: sticky; top: 0; background: var(--bg); }
nav.cats a { white-space: nowrap; text-decoration: none; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 15px; }
h2 { font-size: 20px; margin: 26px 0 10px; }
.item { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.item small { display: block; color: var(--muted); font-size: 14px; }
.price { white-space: nowrap; font-weight: 600; font-variant-numeric: tabular-nums; }
.off { opacity: .45; } .off .price { font-weight: 400; }
.info { margin-top: 32px; font-size: 15px; } .info p { margin: 4px 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 0; }
.chips span { background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 15px; }
.chips a { background: var(--paper); border: 1px solid var(--accent); color: var(--ink); text-decoration: none; border-radius: 999px; padding: 6px 12px; font-size: 15px; }
.masters { display: grid; gap: 8px; }
.master { padding: 10px 12px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; }
.master small { display: block; color: var(--muted); font-size: 14px; }
.links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.links a { text-decoration: none; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; font-size: 15px; }
.ai { margin-top: 10px; font-size: 14px; color: var(--muted); }
.bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--bg) 30%); }
.bar a { display: block; max-width: 608px; margin: 0 auto; text-align: center; background: var(--accent); color: var(--accent-ink); text-decoration: none; font-weight: 600; padding: 14px; border-radius: 12px; }
</style>
