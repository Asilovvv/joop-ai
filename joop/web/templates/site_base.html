<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1719">
<title>{% block title %}Joop AI{% endblock %}</title>
<meta name="description" content="Joop AI — ИИ-администратор для бизнеса Бишкека: отвечает клиентам в WhatsApp, Instagram и Telegram на русском и кыргызском, записывает на свободное время и передаёт сложное людям.">
<meta property="og:title" content="Joop AI — клиент написал в 23:14, ему ответили в 23:14">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b7563'/%3E%3Ctext x='16' y='22.5' font-family='Arial' font-weight='700' font-size='18' text-anchor='middle' fill='%23e8fff8'%3EJ%3C/text%3E%3C/svg%3E">
{% if csrf %}<meta name="csrf" content="{{ csrf }}">{% endif %}
<link rel="stylesheet" href="/static/fonts/fonts.css">
<link rel="stylesheet" href="/static/site.css">
</head>
<body>
<header class="site">
  <div class="wrap">
    <a class="brand" href="/"><span class="mark" aria-hidden="true">J</span>Joop AI<small>жооп — ответ</small></a>
    <nav class="nav" aria-label="Сайт">
      <a href="/#how">Как работает</a>
      <a href="/#niches">Сферы</a>
      <a href="/#price">Цена</a>
      <a href="/studio">Сайт под ключ</a>

      <a href="/signup" class="nav-cta">Попробовать</a>
    </nav>
  </div>
</header>
<main>{% block content %}{% endblock %}</main>
<footer class="site">
  <div class="wrap">
    <span><span class="mark small-mark" aria-hidden="true">J</span>© 2026 {{ legal_name or 'Joop AI' }}, Бишкек</span>
    <span><a href="/privacy">Политика конфиденциальности</a> · <a href="/data-deletion">Удаление данных</a></span>
  </div>
</footer>
</body>
</html>
