{% extends "base.html" %}
{% block title %}Специалисты{% endblock %}
{% block content %}
<section class="stack">
  <h1>Специалисты</h1>
  <p class="muted">По полю «Принимает» ИИ выбирает, к кому записать: например, «удаление зубов, импланты».</p>
</section>
<section class="card">
  {% for r in rows %}
  <form class="row c3" method="post" action="/panel/staff/{{ r.id }}">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input name="name" value="{{ r.name }}" aria-label="Имя" required>
    <input name="role" value="{{ r.role }}" aria-label="Специализация">
    <input name="handles" value="{{ r.handles }}" aria-label="Принимает" placeholder="что принимает">
    <div class="row-tail">
      <button class="btn small ghost" type="submit">Сохранить</button>
      <button class="btn small danger" type="submit" formaction="/panel/staff/{{ r.id }}/delete">Убрать</button>
    </div>
  </form>
  {% else %}<p class="muted">Специалистов нет.</p>{% endfor %}
</section>
<section class="card">
  <h2>Добавить специалиста</h2>
  <form class="row c3" method="post" action="/panel/staff">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input name="name" placeholder="Имя и фамилия" required>
    <input name="role" placeholder="Специализация">
    <input name="handles" placeholder="Принимает: …">
    <div class="row-tail"><button class="btn small" type="submit">Добавить</button></div>
  </form>
</section>
{% endblock %}
