<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ b.name }} — чат</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/static/fonts/fonts.css">
<style>
  :root { --bg: #f4f3ee; --surface: #ffffff; --ink: #10201f; --muted: #5d6b69; --line: #dde3df; --accent: #0e8a72; --accent-ink: #ffffff; --mine: #0e8a72; --mine-ink: #ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b1719; --surface: #122326; --ink: #e4eeeb; --muted: #9fb3af; --line: #233a3d; --accent: #3fc2a5; --accent-ink: #0b1719; --mine: #1f9a81; --mine-ink: #ffffff; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: 'Golos Text', system-ui, sans-serif; background: var(--bg); color: var(--ink); display: flex; justify-content: center; }
  .chat { width: 100%; max-width: 560px; height: 100%; display: flex; flex-direction: column; background: var(--surface); }
  body:not(.embed) .chat { border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
  header { padding: 16px 18px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; }
  .langs { display: flex; gap: 4px; flex-shrink: 0; }
  .langs button { padding: 4px 8px; font-size: 12px; font-weight: 600; border-radius: 8px; background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .langs button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  header b { display: block; font-size: 17px; }
  header span { color: var(--muted); font-size: 13px; }
  .log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 10px 13px; border-radius: 14px; line-height: 1.4; font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .ai { align-self: flex-start; background: var(--bg); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .me { align-self: flex-end; background: var(--mine); color: var(--mine-ink); border-bottom-right-radius: 4px; }
  .note { align-self: center; color: var(--muted); font-size: 13px; text-align: center; }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
  textarea { flex: 1; resize: none; font: inherit; font-size: 15px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-height: 44px; max-height: 120px; }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  button { border: 0; border-radius: 12px; padding: 0 18px; font: 600 15px 'Golos Text', system-ui, sans-serif; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  footer { text-align: center; font-size: 12px; color: var(--muted); padding: 0 0 10px; }
  footer a { color: inherit; }
</style>
</head>
<body class="{{ 'embed' if embed }}">
<main class="chat">
  <header>
    <div><b>{{ b.name }}</b><span id="sub">Отвечает ИИ-администратор, сразу и в любое время</span></div>
    <div class="langs" role="group" aria-label="Язык · Language">
      <button type="button" data-lang="ru">RU</button><button type="button" data-lang="ky">KY</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="zh">中文</button>
    </div>
  </header>
  <div class="log" id="log" aria-live="polite">
    <div class="msg ai" id="hello">Здравствуйте! Напишите ваш вопрос: цены, свободное время, запись.</div>
  </div>
  <form id="form">
    <label for="text" class="note" style="position:absolute;left:-9999px">Сообщение</label>
    <textarea id="text" rows="1" maxlength="1000" placeholder="Напишите сообщение…" required></textarea>
    <button type="submit" id="send">Отправить</button>
  </form>
  <footer><span id="by">Работает на</span> <a href="/" target="_blank" rel="noopener">Joop AI</a></footer>
</main>
<script>
(function () {
  var slug = {{ b.slug | tojson }}, key = 'joop-chat-' + slug, visitor = '', lang = 'ru';
  var T = {
    ru: {sub: 'Отвечает ИИ-администратор, сразу и в любое время', hello: 'Здравствуйте! Напишите ваш вопрос: цены, свободное время, запись.',
         ph: 'Напишите сообщение…', send: 'Отправить', by: 'Работает на', off: 'Нет связи. Попробуйте ещё раз.'},
    ky: {sub: 'ИИ-администратор дароо жана каалаган убакта жооп берет', hello: 'Саламатсызбы! Сурооңузду жазыңыз: баалар, бош убакыт, жазылуу.',
         ph: 'Билдирүү жазыңыз…', send: 'Жөнөтүү', by: 'Иштетет', off: 'Байланыш жок. Кайра аракет кылыңыз.'},
    en: {sub: 'An AI assistant replies right away, any time', hello: 'Hello! Ask us anything: prices, free times, booking.',
         ph: 'Type a message…', send: 'Send', by: 'Powered by', off: 'No connection. Please try again.'},
    zh: {sub: 'AI 助理随时立即回复', hello: '您好！请提出您的问题：价格、空闲时间、预约。',
         ph: '输入消息…', send: '发送', by: '技术支持', off: '无网络连接，请重试。'}
  };
  try { visitor = localStorage.getItem(key) || ''; lang = localStorage.getItem('joop-lang') || ''; } catch (e) {}
  if (!T[lang]) {
    var nav = (navigator.language || 'ru').slice(0, 2).toLowerCase();
    lang = T[nav] ? nav : 'ru';
  }
  var log = document.getElementById('log'), form = document.getElementById('form'),
      text = document.getElementById('text'), send = document.getElementById('send');
  function setLang(next) {
    lang = next;
    try { localStorage.setItem('joop-lang', lang); } catch (e) {}
    document.documentElement.lang = lang;
    document.getElementById('sub').textContent = T[lang].sub;
    var hello = document.getElementById('hello');
    if (hello) hello.textContent = T[lang].hello;
    text.placeholder = T[lang].ph;
    send.textContent = T[lang].send;
    document.getElementById('by').textContent = T[lang].by;
    Array.prototype.forEach.call(document.querySelectorAll('.langs button'), function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === lang));
    });
  }
  Array.prototype.forEach.call(document.querySelectorAll('.langs button'), function (b) {
    b.addEventListener('click', function () { setLang(b.getAttribute('data-lang')); text.focus(); });
  });
  setLang(lang);
  function add(cls, body) {
    var div = document.createElement('div');
    div.className = 'msg ' + cls;
    div.textContent = body;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }
  text.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var value = text.value.trim();
    if (!value) return;
    add('me', value);
    text.value = '';
    send.disabled = true;
    var wait = add('note', '…');
    fetch('/c/' + encodeURIComponent(slug) + '/chat', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text: value, visitor: visitor, lang: lang})
    }).then(function (r) { return r.json(); }).then(function (data) {
      wait.remove();
      if (data.visitor) { visitor = data.visitor; try { localStorage.setItem(key, visitor); } catch (e) {} }
      if (data.reply) add('ai', data.reply);
      else if (data.error) add('note', data.error);
    }).catch(function () {
      wait.remove();
      add('note', T[lang].off);
    }).finally(function () { send.disabled = false; text.focus(); });
  });
})();
</script>
</body>
</html>
