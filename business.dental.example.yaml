faq:
  - q: "Есть ли рентген в клинике?"
    a: "Да, прицельный снимок делаем на месте."
  - q: "Можно оплатить картой или QR?"
    a: "Да, наличные, карта и QR."
  - q: "Больно ли лечить зубы?"
    a: "Лечение проводится с местной анестезией, если она нужна; это решает врач."
  - q: "Принимаете ли без записи?"
    a: "Да, но лучше записаться: без записи врач может быть занят."

