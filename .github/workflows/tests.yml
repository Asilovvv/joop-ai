# Unit tests on every push and pull request (no secrets, no network calls to the model).
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 25  # the suite took 6 min on 21.11 and 9.7 on 26.11, when a 10-minute limit cut a run
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q --durations=15  # the slowest tests in the log: what to speed up next
