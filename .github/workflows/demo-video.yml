# Records the demo walk-through as a video on the real model (scripts/record_demo.py), started by hand:
# Actions -> demo-video -> Run workflow. Needs the repository secret ANTHROPIC_API_KEY; one recording is a handful
# of model calls (well under a cent on claude-haiku-5-5).
# The MP4 files and the dialogue as text are kept as an artifact of the run for 30 days. A recording fails, and keeps
# no video, when the model does not answer (an empty balance) or the walk breaks: see the script's header. With
# "both", a language that failed does not take the other one's video with it: what was made is kept, the run is red.
name: demo-video

on:
  workflow_dispatch:
    inputs:
      captions:
        description: "Captions and cards: en, ru or both (two recordings)"
        required: false
        default: "both"
      model:
        description: "Model for this recording (empty = JOOP_MODEL default, claude-haiku-5-5)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: demo-video
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - name: ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -1 && ffprobe -version | head -1

      - name: Record
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          JOOP_MODEL: ${{ inputs.model }}
          CAPTIONS: ${{ inputs.captions }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add the repository secret ANTHROPIC_API_KEY (Settings -> Secrets and variables -> Actions)"
            exit 1
          fi
          case "$CAPTIONS" in
            both) langs="en ru" ;;
            en|ru) langs="$CAPTIONS" ;;
            *) echo "::error::captions must be en, ru or both"; exit 1 ;;
          esac
          failed=""
          for lang in $langs; do
            python scripts/record_demo.py demo-video --captions "$lang" || failed="$failed $lang"
          done
          if ls demo-video/*.txt >/dev/null 2>&1; then
            {
              echo "### Demo video"
              echo ""
              echo "Download **joop-demo-video** under Artifacts on this page. The dialogue the model wrote:"
              echo ""
              echo '```'
              cat demo-video/*.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$failed" ]; then
            echo "::error::No video for:$failed. The reason is in this step's log, after «No video:»"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: joop-demo-video
          path: |
            demo-video/*.mp4
            demo-video/*.txt
          retention-days: 30
          if-no-files-found: ignore
